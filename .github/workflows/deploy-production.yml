name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy To VPS
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          missing=()

          [ -z "${{ secrets.VPS_HOST }}" ] && missing+=("VPS_HOST")
          [ -z "${{ secrets.VPS_PORT }}" ] && missing+=("VPS_PORT")
          [ -z "${{ secrets.VPS_USER }}" ] && missing+=("VPS_USER")
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ] && [ -z "${{ secrets.VPS_SSH_KEY_B64 }}" ]; then
            missing+=("VPS_SSH_KEY or VPS_SSH_KEY_B64")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required GitHub secrets: ${missing[*]}"
            exit 1
          fi

      - name: Deploy via SSH
        shell: bash
        env:
          VPS_PROJECT_DIR: ${{ secrets.VPS_PROJECT_DIR }}
          VPS_COMPOSE_FILE: ${{ secrets.VPS_COMPOSE_FILE }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          set -euo pipefail

          RAW_HOST="${{ secrets.VPS_HOST }}"
          RAW_PORT="${{ secrets.VPS_PORT }}"
          RAW_USER="${{ secrets.VPS_USER }}"
          HOST="$(printf '%s' "$RAW_HOST" | tr -d '\r' | xargs)"
          PORT="$(printf '%s' "$RAW_PORT" | tr -d '\r' | xargs)"
          USER="$(printf '%s' "$RAW_USER" | tr -d '\r' | xargs)"

          # Accept common misconfigurations: scheme/path/inline-port in VPS_HOST.
          HOST="${HOST#http://}"
          HOST="${HOST#https://}"
          HOST="${HOST#ssh://}"
          HOST="${HOST%%/*}"
          HOST="${HOST%%:*}"
          HOST="${HOST##*@}"

          if [ -z "$HOST" ]; then
            echo "VPS_HOST is empty after normalization."
            exit 1
          fi

          if [ -z "$PORT" ]; then
            echo "VPS_PORT is empty."
            exit 1
          fi

          if [ -z "$USER" ]; then
            echo "VPS_USER is empty after normalization."
            exit 1
          fi

          mkdir -p ~/.ssh
          if [ -n "${VPS_SSH_KEY_B64:-}" ] && [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "Both VPS_SSH_KEY_B64 and VPS_SSH_KEY are set. VPS_SSH_KEY_B64 takes precedence."
          fi

          if [ -n "${VPS_SSH_KEY_B64:-}" ]; then
            if ! printf "%s" "$VPS_SSH_KEY_B64" | base64 --decode > ~/.ssh/deploy_key; then
              echo "VPS_SSH_KEY_B64 is not valid base64."
              exit 1
            fi
          else
            printf "%s\n" "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key

          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "SSH key is invalid, incomplete, or passphrase-protected."
            echo "Use VPS_SSH_KEY_B64 (recommended) or a valid multiline VPS_SSH_KEY."
            exit 1
          fi

          if ! [[ "$PORT" =~ ^[0-9]+$ ]]; then
            echo "VPS_PORT must be a numeric value."
            exit 1
          fi

          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          PROJECT_DIR="${VPS_PROJECT_DIR:-/root/jlpt_start}"
          COMPOSE_FILE="${VPS_COMPOSE_FILE:-docker-compose.prod.yml}"
          SSH_TARGET="$USER@$HOST"
          SSH_OPTS="-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

          if command -v nc >/dev/null 2>&1; then
            if ! nc -z -w 8 "$HOST" "$PORT"; then
              echo "TCP preflight failed: cannot reach $HOST:$PORT from GitHub runner."
              echo "Check firewall/security-group/UFW rules."
              exit 1
            fi
          fi

          SSH_ERR_FILE="$(mktemp)"
          if ! ssh $SSH_OPTS -i ~/.ssh/deploy_key -p "$PORT" "$SSH_TARGET" "echo SSH connectivity OK" >/dev/null 2>"$SSH_ERR_FILE"; then
            echo "Cannot establish SSH connection from GitHub runner to VPS."
            echo "Check VPS_HOST/VPS_PORT/VPS_USER and firewall rules (allow SSH from GitHub Actions)."
            echo "SSH details:"
            sed -e 's/^/  /' "$SSH_ERR_FILE" | tail -n 20
            if grep -qi "Permission denied" "$SSH_ERR_FILE"; then
              echo "Likely auth issue: wrong SSH key/user, or key not in ~/.ssh/authorized_keys on VPS."
            elif grep -qiE "Connection timed out|No route to host|Connection refused" "$SSH_ERR_FILE"; then
              echo "Likely network issue: port blocked or SSH daemon not reachable."
            fi
            exit 1
          fi

          ssh $SSH_OPTS -i ~/.ssh/deploy_key -p "$PORT" "$SSH_TARGET" \
            "PROJECT_DIR='$PROJECT_DIR' COMPOSE_FILE='$COMPOSE_FILE' bash -s" <<'EOF'
          set -euo pipefail

          echo "Deploy host: $(hostname)"
          echo "Deploy user: $(whoami)"
          echo "Project dir: $PROJECT_DIR"
          echo "Compose file: $COMPOSE_FILE"

          if ! command -v git >/dev/null 2>&1; then
            echo "git is not installed on VPS."
            exit 1
          fi

          if ! command -v docker >/dev/null 2>&1; then
            echo "docker is not installed on VPS."
            exit 1
          fi

          if ! docker compose version >/dev/null 2>&1; then
            echo "docker compose plugin is missing on VPS."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "PROJECT_DIR does not exist: $PROJECT_DIR"
            exit 1
          fi

          cd "$PROJECT_DIR"

          if [ ! -f "$COMPOSE_FILE" ]; then
            echo "Compose file not found in project dir: $PROJECT_DIR/$COMPOSE_FILE"
            exit 1
          fi

          if [ ! -d .git ]; then
            echo "Project directory is not a git repository: $PROJECT_DIR"
            exit 1
          fi

          echo "Pulling latest code..."
          git fetch origin main
          git reset --hard origin/main

          echo "Rebuilding containers..."
          docker compose -f "$COMPOSE_FILE" up -d --build

          echo "Waiting for web container..."
          ready=0
          for i in $(seq 1 30); do
            if docker compose -f "$COMPOSE_FILE" exec -T web python -V >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "web service is not ready after 60 seconds."
            docker compose -f "$COMPOSE_FILE" ps
            docker compose -f "$COMPOSE_FILE" logs --tail=80 web || true
            exit 1
          fi

          echo "Running migrations..."
          docker compose -f "$COMPOSE_FILE" exec -T web python manage.py migrate

          echo "Collecting static files..."
          docker compose -f "$COMPOSE_FILE" exec -T web python manage.py collectstatic --noinput

          echo "Pruning unused images..."
          docker image prune -f

          echo "Deploy complete."
          EOF
