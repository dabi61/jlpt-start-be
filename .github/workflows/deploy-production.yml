name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy To VPS
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          missing=()

          [ -z "${{ secrets.VPS_HOST }}" ] && missing+=("VPS_HOST")
          [ -z "${{ secrets.VPS_PORT }}" ] && missing+=("VPS_PORT")
          [ -z "${{ secrets.VPS_USER }}" ] && missing+=("VPS_USER")
          [ -z "${{ secrets.VPS_SSH_KEY }}" ] && missing+=("VPS_SSH_KEY")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required GitHub secrets: ${missing[*]}"
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          timeout: 30m
          command_timeout: 30m
          script: |
            set -e

            PROJECT_DIR="${{ secrets.VPS_PROJECT_DIR }}"
            COMPOSE_FILE="${{ secrets.VPS_COMPOSE_FILE }}"

            if [ -z "$PROJECT_DIR" ]; then
              PROJECT_DIR="/root/jlpt_start"
            fi

            if [ -z "$COMPOSE_FILE" ]; then
              COMPOSE_FILE="docker-compose.prod.yml"
            fi

            cd "$PROJECT_DIR"

            echo "🔹 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "🔹 Rebuilding containers..."
            docker compose -f "$COMPOSE_FILE" up -d --build

            echo "🔹 Running migrations..."
            docker compose -f "$COMPOSE_FILE" exec -T web python manage.py migrate

            echo "🔹 Collecting static files..."
            docker compose -f "$COMPOSE_FILE" exec -T web python manage.py collectstatic --noinput

            echo "🔹 Pruning unused images..."
            docker image prune -f

            echo "✅ Deploy complete."
