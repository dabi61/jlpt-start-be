# Docker embedded DNS server. Using `proxy_pass` with a variable ensures nginx
# re-resolves the `web` hostname (otherwise nginx can cache an old container IP).
resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 80;
    server_name jlpt.codes www.jlpt.codes;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name jlpt.codes www.jlpt.codes;

    ssl_certificate /etc/letsencrypt/live/jlpt.codes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jlpt.codes/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }
}
